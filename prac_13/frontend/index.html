<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Для Android -->
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Цвет темы для браузера -->
    <meta name="theme-color" content="#4285f4">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Иконки для разных устройств -->
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png">
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    
    <!-- Styles -->
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    <link rel="stylesheet" href="/styles.css">
    
    <title>Мои заметки - PWA приложение</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Мои заметки</h1>
            <p class="subtitle">Работает даже без интернета!</p>
        </header>
        
        <div class="status-card" id="status-card">
            <div class="status-indicator" id="status-indicator"></div>
            <span id="status-text">Онлайн</span>
        </div>
        
        <form id="note-form" class="row">
            <div class="col-9">
                <input type="text" id="note-input" placeholder="Введите заметку..." required>
            </div>
            <div class="col-3">
                <button type="submit" id="add-btn">➕ Добавить</button>
            </div>
        </form>
        
        <div class="stats">
            <span id="notes-count">0 заметок</span>
            <button id="clear-all-btn" class="clear-btn">🗑️ Очистить все</button>
        </div>
        
        <ul id="notes-list" class="notes-list"></ul>
        
        <footer>
            <p>PWA приложение | Работает офлайн</p>
        </footer>
    </div>
    
    <script src="/app.js"></script>
</body>
</html>
