<div class="home-content">
    <div class="toolbar" style="margin-bottom: 20px;">
        <input type="text" id="search-input" class="search-box" placeholder="🔍 Поиск заметок..." style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px;">
        <div class="filter-buttons" style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="filter-btn active" data-filter="all" style="padding: 8px 16px; background: #f0f0f0; border: none; border-radius: 10px; cursor: pointer;">Все</button>
            <button class="filter-btn" data-filter="today" style="padding: 8px 16px; background: #f0f0f0; border: none; border-radius: 10px; cursor: pointer;">Сегодня</button>
            <button class="filter-btn" data-filter="week" style="padding: 8px 16px; background: #f0f0f0; border: none; border-radius: 10px; cursor: pointer;">Неделя</button>
        </div>
    </div>
    
    <form id="note-form" style="margin-bottom: 30px; display: flex; gap: 10px; flex-wrap: wrap;">
        <textarea id="note-input" placeholder="Введите заметку..." rows="3" style="flex: 1; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-family: inherit;"></textarea>
        <button type="submit" style="padding: 12px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; cursor: pointer;">➕ Добавить</button>
        <button type="button" id="clear-all" style="padding: 12px 24px; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; border: none; border-radius: 10px; cursor: pointer;">🗑️ Очистить все</button>
    </form>
    
    <h2 class="is-center" style="margin-top: 2rem;">📋 Список заметок</h2>
    <div id="notes-container" class="notes-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;"></div>
</div>

<style>
    .note-card {
        background: #f8f9fa;
        border-radius: 15px;
        padding: 20px;
        transition: transform 0.3s, box-shadow 0.3s;
        animation: slideIn 0.3s ease;
    }
    
    .note-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    
    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .note-text {
        font-size: 16px;
        color: #333;
        line-height: 1.5;
        margin-bottom: 15px;
        word-break: break-word;
        white-space: pre-wrap;
    }
    
    .note-date {
        font-size: 11px;
        color: #999;
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .note-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
    }
    
    .edit-btn, .delete-btn, .save-btn, .cancel-btn {
        padding: 6px 12px;
        font-size: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        color: white;
    }
    
    .edit-btn { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .delete-btn { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .save-btn { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    .cancel-btn { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
    
    .edit-textarea {
        width: 100%;
        padding: 10px;
        border: 2px solid #4285f4;
        border-radius: 10px;
        font-size: 14px;
        font-family: inherit;
        margin-bottom: 10px;
        resize: vertical;
    }
    
    .empty-message {
        text-align: center;
        color: #999;
        padding: 60px;
        font-style: italic;
        background: #f8f9fa;
        border-radius: 10px;
        grid-column: 1 / -1;
    }
    
    .search-box:focus, #note-input:focus {
        outline: none;
        border-color: #4285f4;
    }
</style>
