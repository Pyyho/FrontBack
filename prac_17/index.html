<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4285f4">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Заметки PWA">
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png">
    
    <title>📝 Заметки | PWA с уведомлениями</title>
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #4285f4;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        .no-break {
            white-space: nowrap;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        
        .tab {
            flex: 1;
            padding: 12px 24px;
            background: none;
            color: #666;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab:hover:not(.active) {
            background: #f0f0f0;
            transform: translateY(-2px);
        }
        
        #status {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .status.online {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #155724;
        }
        
        .status.offline {
            background: linear-gradient(135deg, #fad0c4 0%, #ffd1ff 100%);
            color: #721c24;
        }
        
        .notification-panel {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #333;
        }
        
        .btn-error {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: white;
        }
        
        .stats {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
            color: #666;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .install-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 20px; }
            h1 { font-size: 1.3em; }
            .tab { padding: 8px 16px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 <span class="no-break">Мои заметки</span> <span class="no-break">- PWA приложение</span></h1>
        
        <div id="status"></div>
        
        <div class="tabs">
            <button id="home-btn" class="tab active">🏠 Главная</button>
            <button id="about-btn" class="tab">ℹ️ О приложении</button>
        </div>
        
        <div class="notification-panel">
            <button id="enable-push" class="btn-success" style="display: none;">🔔 Включить уведомления</button>
            <button id="disable-push" class="btn-error" style="display: none;">🔕 Отключить уведомления</button>
        </div>
        
        <main id="app-content">
            <!-- Сюда загружается контент через fetch -->
        </main>
        
        <div class="stats">
            <div id="stats"></div>
            <div>
                <button id="export-btn" class="small-btn" style="padding: 8px 16px; background: #6c5ce7; border: none; border-radius: 8px; color: white; cursor: pointer;">📤 Экспорт</button>
                <button id="import-btn" class="small-btn" style="padding: 8px 16px; background: #6c5ce7; border: none; border-radius: 8px; color: white; cursor: pointer;">📥 Импорт</button>
                <input type="file" id="import-file" accept=".json" style="display: none;">
            </div>
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
