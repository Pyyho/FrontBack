<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/prac_15/manifest.json">
    
    <!-- Для Android -->
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Цвет темы для браузера -->
    <meta name="theme-color" content="#4285f4">
    
    <!-- Для iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Заметки">
    <link rel="apple-touch-icon" href="/prac_15/icons/icon-152x152.png">
    <link rel="icon" href="/prac_15/icons/favicon.ico" sizes="16x16" type="image/ico">
    
    <title>Заметки | PWA приложение</title>
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        header h1 {
            color: #4285f4;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        header h1 .no-break {
            white-space: nowrap;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        
        .tab {
            flex: 1;
            padding: 12px 24px;
            background: #f0f0f0;
            color: #666;
            border: none;
            border-radius: 10px 10px 0 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab:hover:not(.active) {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        
        #status {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .status.online {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #155724;
        }
        
        .status.offline {
            background: linear-gradient(135deg, #fad0c4 0%, #ffd1ff 100%);
            color: #721c24;
        }
        
        .install-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 20px; }
            header h1 { font-size: 1.2em; }
            .tab { padding: 8px 16px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>А вот и «Заметки» – наше первое <span class="no-break">оффлайн-приложение</span></h1>
            <div class="tabs">
                <button id="home-btn" class="tab active col-6">🏠 Главная</button>
                <button id="about-btn" class="tab col-6">ℹ️ О приложении</button>
            </div>
        </header>
        
        <div id="status"></div>
        
        <!-- Основной контейнер для динамического контента -->
        <main id="app-content">
            <!-- Сюда будет загружаться контент -->
        </main>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/prac_15/app.js"></script>
</body>
</html>
