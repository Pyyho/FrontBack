<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/prac_13/manifest.json">
    
    <!-- Для Android -->
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Цвет темы для браузера -->
    <meta name="theme-color" content="#4285f4">
    
    <!-- Для iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Заметки">
    <link rel="apple-touch-icon" href="/prac_13/icons/icon-152x152.png">
    
    <title>Мои заметки | PWA приложение</title>
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #4285f4;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        #status {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .status.online {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #155724;
        }
        
        .status.offline {
            background: linear-gradient(135deg, #fad0c4 0%, #ffd1ff 100%);
            color: #721c24;
        }
        
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .search-box {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #4285f4;
        }
        
        .filter-buttons {
            display: flex;
            gap: 10px;
        }
        
        .filter-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            color: #666;
            font-size: 14px;
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        #note-form {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        #note-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        #note-input:focus {
            outline: none;
            border-color: #4285f4;
        }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .clear-all-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .note-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            animation: slideIn 0.3s ease;
            position: relative;
        }
        
        .note-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .note-text {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
            margin-bottom: 15px;
            word-break: break-word;
            white-space: pre-wrap;
        }
        
        .note-date {
            font-size: 11px;
            color: #999;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .note-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .edit-btn, .delete-btn, .save-btn, .cancel-btn {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .edit-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .delete-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .save-btn {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        
        .cancel-btn {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }
        
        .edit-textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #4285f4;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 10px;
            resize: vertical;
        }
        
        .empty-message {
            text-align: center;
            color: #999;
            padding: 60px;
            font-style: italic;
            background: #f8f9fa;
            border-radius: 10px;
            grid-column: 1 / -1;
        }
        
        .stats {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
            color: #666;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .export-import {
            display: flex;
            gap: 10px;
        }
        
        .small-btn {
            padding: 8px 16px;
            font-size: 12px;
            background: #6c5ce7;
        }
        
        .install-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 2000;
            animation: slideInRight 0.3s ease;
            max-width: 300px;
        }
        
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .notification.success {
            border-left: 4px solid #43e97b;
        }
        
        .notification.error {
            border-left: 4px solid #f5576c;
        }
        
        .notification.info {
            border-left: 4px solid #4285f4;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 20px;
            }
            
            .notes-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .toolbar {
                flex-direction: column;
            }
            
            .filter-buttons {
                justify-content: center;
            }
            
            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Мои заметки</h1>
        <div id="status"></div>
        
        <div class="toolbar">
            <input type="text" id="search-input" class="search-box" placeholder="🔍 Поиск заметок...">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="today">Сегодня</button>
                <button class="filter-btn" data-filter="week">Неделя</button>
            </div>
        </div>
        
        <form id="note-form">
            <textarea id="note-input" placeholder="Введите заметку..." rows="3" required></textarea>
            <button type="submit">➕ Добавить</button>
            <button type="button" id="clear-all" class="clear-all-btn">🗑️ Очистить все</button>
        </form>
        
        <div id="notes-container" class="notes-grid"></div>
        
        <div class="stats">
            <div id="stats"></div>
            <div class="export-import">
                <button id="export-btn" class="small-btn">📤 Экспорт</button>
                <button id="import-btn" class="small-btn">📥 Импорт</button>
                <input type="file" id="import-file" accept=".json" style="display: none;">
            </div>
        </div>
    </div>

    <script src="/prac_13/app.js"></script>
</body>
</html>
